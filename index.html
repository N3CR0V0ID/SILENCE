<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hours of Silence: Meme Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🤫 10 Hours of Silence Broken By...</h1>

    <!-- Core Engine Parameters -->
    <div class="card">
        <div class="control-group">
            <label>Check Every: <span id="interval-val">5</span> seconds</label>
            <input type="range" id="interval-input" min="1" max="30" value="5">
        </div>
        <div class="control-group">
            <label>Jumpscare Probability: <span id="chance-val">25</span>%</label>
            <input type="range" id="chance-input" min="1" max="100" value="25">
        </div>
        <button id="start-btn">⚡ Start the Silence</button>
        <div id="status-display" class="status">Engine Status: Standing By...</div>
    </div>

    <!-- The Preloaded Meme Inventory -->
    <div class="card">
        <div class="inventory-header">
            <label>🔊 Toggle Meme Roster</label>
            <div>
                <button id="select-all-btn" class="mini-btn">Check All</button>
                <button id="clear-all-btn" class="mini-btn">Uncheck All</button>
            </div>
        </div>
        <div id="sound-pool-list">
            <!-- Populated automatically by the script.js array -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
