<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hours of Silence Engine</title>
    <!-- Double check that this exactly matches your CSS file name -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🤫 Hours of Silence Engine</h1>

    <!-- Configuration Panel Container -->
    <div class="card">
        <div class="control-group">
            <label>Check Interval: <span id="interval-val">5</span> seconds</label>
            <input type="range" id="interval-input" min="1" max="30" value="5">
        </div>
        <div class="control-group">
            <label>Trigger Probability: <span id="chance-val">30</span>%</label>
            <input type="range" id="chance-input" min="1" max="100" value="30">
        </div>
        <button id="start-btn">⚡ Initialize Silence</button>
        <div id="status-display" class="status">Engine Status: Idle</div>
    </div>

    <!-- Active Management Roster Panel -->
    <div class="card">
        <div class="inventory-header">
            <label>🔊 Active Sound Inventory</label>
            <div>
                <button id="select-all-btn" class="mini-btn">Check All</button>
                <button id="clear-all-btn" class="mini-btn">Uncheck All</button>
            </div>
        </div>
        
        <div id="sound-pool-list">
            <!-- JavaScript populates your meme list right here -->
        </div>
    </div>

    <!-- Script declaration placed securely at the bottom of body execution -->
    <script src="script.js"></script>
</body>
</html>
